name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建与部署拆成两个 job：job 之间有调度开销，
  # 正好等过 artifact 索引的最终一致性延迟
  # （实测同 job 内上传成功后仅隔 0.46 秒查询，返回 0 个 artifact）
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 准备站点文件
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - name: 打包站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
