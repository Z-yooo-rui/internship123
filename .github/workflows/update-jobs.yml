name: 抓取岗位数据

on:
  schedule:
    # 每 2 小时整点运行（UTC 时间，与北京时间无关，因为是间隔）
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并生成数据
        run: python scripts/fetch_jobs.py

      - name: 提交变更
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: 更新岗位数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
