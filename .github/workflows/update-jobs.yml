name: 抓取岗位数据

on:
  schedule:
    # 错峰：避开整点（GitHub 整点负载最高，排队的定时任务会被直接丢弃）
    # 实测 2 小时间隔丢得很厉害，改成每小时一次提高命中概率
    # UTC 每小时 37 分 = 北京时间每小时 37 分
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 抓取并生成数据
        run: python scripts/fetch_jobs.py

      - name: 提交变更
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: 更新岗位数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
